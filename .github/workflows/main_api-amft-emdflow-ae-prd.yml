# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - api-amft-emdflow-ae-prd

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_97AA6B8C6D6B4EF08D4B0B5AD18393CD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9367CFA8219844439DC8CBAD2C5E5627 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_870A2BE261D64F92A5BDA6FAF1BF59F4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-amft-emdflow-ae-prd'
          slot-name: 'Production'
          package: .

      # One-time-ish bootstrap: gives the App Service a system-assigned identity (so it can
      # authenticate to Azure SQL as itself, no password/secret needed) and points it at the
      # real database + Entra ID app registration. Safe to re-run - both commands are idempotent.
      - name: Configure app settings
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp identity assign --name api-amft-emdflow-ae-prd --resource-group emdflow-amft-ae-prd
            az webapp config appsettings set --name api-amft-emdflow-ae-prd --resource-group emdflow-amft-ae-prd --settings \
              ConnectionStrings__Default="Server=tcp:sqlserver-emd-ae-prd.database.windows.net,1433;Initial Catalog=free-sql-db-9758318;Encrypt=True;TrustServerCertificate=False;Authentication=Active Directory Default;" \
              Storage__Mode="Mock"
